# Infrastructure only. No business details, credentials for Invoice Ninja /
# Docuseal, or brand assets belong here — they are entered in the setup wizard.
services:
  app:
    image: hirestation:latest
    build: .
    restart: unless-stopped
    # Only HireStation's own settings are passed in (not the whole .env, which may also hold
    # Docuseal / Invoice Ninja secrets when using the bundled presets).
    environment: &hirestation-env
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hirestation}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hirestation}
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /data
      PORT: 3000  # inside the container; publish on the host with APP_PORT
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - storage:/data
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    image: hirestation:latest  # built by the app service
    restart: unless-stopped
    command: ["node", "dist/jobs/worker.js"]
    healthcheck:
      disable: true
    environment:
      <<: *hirestation-env
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /data
    volumes:
      - storage:/data
    depends_on:
      app: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hirestation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hirestation}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hirestation}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  # Nightly pg_dump + storage tarball into ./backups (point your usual off-site sync at it).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-hirestation}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-hirestation}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
      - storage:/data:ro
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  storage:
