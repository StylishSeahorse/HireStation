# Infrastructure only. No business details, credentials for Invoice Ninja /
# Docuseal, or brand assets belong here — they are entered in the setup wizard.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hirestation}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hirestation}
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /data
    ports:
      - "${APP_BIND:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - storage:/data
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/jobs/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hirestation}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hirestation}
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /data
    volumes:
      - storage:/data
    depends_on:
      app: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hirestation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hirestation}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hirestation}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  # Nightly pg_dump + storage tarball into ./backups (point your usual off-site sync at it).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-hirestation}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-hirestation}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
      - storage:/data:ro
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  storage:
