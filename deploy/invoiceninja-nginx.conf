# nginx for the bundled Invoice Ninja (docker-compose.invoiceninja.yml).
# Sits behind your main reverse proxy, which should pass X-Forwarded-Proto/For/Host
# so Invoice Ninja (TRUSTED_PROXIES=*) knows requests arrived over HTTPS.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 50M;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass in-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known) { deny all; }
}
