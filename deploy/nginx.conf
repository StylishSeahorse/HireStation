# nginx. Replace the hostname and certificate paths (e.g. from certbot).
server {
    listen 80;
    server_name hire.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hire.example.com;

    ssl_certificate     /etc/letsencrypt/live/hire.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hire.example.com/privkey.pem;

    # Uploads (logo, equipment photos) are capped at 10 MB by the app.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # The app uses these for the client IP (login throttling, audit log),
        # the Origin check on state-changing requests, and HTTPS detection.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
